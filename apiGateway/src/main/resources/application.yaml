server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Automatically creates routes based on Eureka service IDs
          lower-case-service-id: true # Changes /TODO-SERVICE/ to /todo-service/ in the URL
      routes:
        # AUTOMATED DISCOVERY ROUTING
        - id: todo-service-route
          uri: lb://TODO-SERVICE # "lb://" stands for Load Balancer. It fetches the real IP from Eureka.
          predicates:
            - Path=/todos/**

# Connects your Gateway to the Eureka server registry
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/




